# Shared continuous-test pipeline for Amphora on CNB.
# Included from the repository-root `.cnb.yml`.
#
# Coverage:
# - push on every branch (`$`)
# - pull_request targeting `main`
#
# Physical-device instrumented tests are manual (Tailscale ADB).

main:
  pull_request:
    - name: continuous-test
      runner:
        cpus: 8
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.gradle:cow
          - /opt/android-sdk:cow
      git:
        submodules: true
      env:
        ANDROID_HOME: /opt/android-sdk
        ANDROID_SDK_ROOT: /opt/android-sdk
      stages:
        - name: setup-android-sdk
          script: bash scripts/setup-android-sdk.sh
        - name: jvm-unit-tests
          script: bash scripts/ci-jvm-test.sh
        - name: assemble-debug
          script: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

$:
  push:
    - name: continuous-test
      runner:
        cpus: 8
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.gradle:cow
          - /opt/android-sdk:cow
      git:
        submodules: true
      env:
        ANDROID_HOME: /opt/android-sdk
        ANDROID_SDK_ROOT: /opt/android-sdk
      stages:
        - name: setup-android-sdk
          script: bash scripts/setup-android-sdk.sh
        - name: jvm-unit-tests
          script: bash scripts/ci-jvm-test.sh
        - name: assemble-debug
          script: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
