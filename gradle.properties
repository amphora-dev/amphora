# Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Keep the daemon warm in local/cloud agent sessions (CI still fine with setup-gradle).
org.gradle.daemon=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Amphora content pins. Single source of truth for the remote manifest URL: the app
# reads it through BuildConfig (ContentManifestLoader), and :app:stageBundledContent
# fetches the same file so staged assets match the pins the device will verify.
amphora.contentManifest.url=https://raw.githubusercontent.com/amphora-dev/content_manifest/main/content_manifest.json
