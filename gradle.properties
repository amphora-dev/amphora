# Gradle
# idea.home.path / idea.config.path: KSP2's Analysis API embeds IntelliJ PathManager,
# which otherwise probes the classpath for product-info.json and can fail flakily in CI
# (google/ksp#3057). Relative paths resolve against the project CWD Gradle uses.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Didea.home.path=.ci/idea-home -Didea.config.path=build/idea-config
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Keep the daemon warm in local/cloud agent sessions (CI still fine with setup-gradle).
org.gradle.daemon=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Amphora content pins. Single source of truth for the remote manifest URL: the app
# reads it through BuildConfig (ContentManifestLoader), and :app:stageBundledContent
# fetches the same file so staged assets match the pins the device will verify.
#
# Development channel: GitHub Contents API tracks the main Git object with a
# short cache window. Raw GitHub is the fallback; transient failures/rate limits
# are surfaced as retryable errors.
amphora.contentManifest.url=https://api.github.com/repos/amphora-dev/content_manifest/contents/content_manifest.json?ref=main

# APK auto-update pin (same repository/API as content pins). Amphora CI on main publishes
# amphora-debug.apk to the rolling Release tag `apk`, then writes app_update.json here.
amphora.appUpdate.url=https://api.github.com/repos/amphora-dev/content_manifest/contents/app_update.json?ref=main
