# Gradle
# idea.home.path / idea.config.path: KSP2's Analysis API embeds IntelliJ PathManager,
# which otherwise probes the classpath for product-info.json and can fail flakily in CI
# (google/ksp#3057). Relative paths resolve against the project CWD Gradle uses.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Didea.home.path=.ci/idea-home -Didea.config.path=build/idea-config
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Keep the daemon warm in local/cloud agent sessions (CI still fine with setup-gradle).
org.gradle.daemon=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Amphora content pins. Single source of truth for the remote manifest URL: the app
# reads it through BuildConfig (ContentManifestLoader), and :app:stageBundledContent
# fetches the same file so staged assets match the pins the device will verify.
#
# Use jsDelivr @latest (semver), NOT @main. Branch refs cache up to ~12h and cannot
# be purged reliably; each content_manifest main pin bump tags vX.Y.Z and purges
# @latest in CI. Fallbacks: raw GitHub, then Contents API (rate-limited — last resort).
amphora.contentManifest.url=https://raw.githubusercontent.com/amphora-dev/content_manifest/main/content_manifest.json

# APK auto-update pin (same repo/CDN as content pins). amphora CI on main publishes
# amphora-debug.apk to the rolling Release tag `apk`, then writes app_update.json here.
amphora.appUpdate.url=https://cdn.jsdelivr.net/gh/amphora-dev/content_manifest@latest/app_update.json
