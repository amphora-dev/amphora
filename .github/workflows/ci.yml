name: CI

on:
  pull_request:
  push:

env:
  CCACHE_DIR: ${{ github.workspace }}/.native-cache/ccache
  CCACHE_MAXSIZE: 2G

jobs:
  continuous-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ccache
        run: bash scripts/setup-ccache.sh

      - name: Cache native compile artifacts
        uses: actions/cache@v4
        with:
          path: |
            .native-cache
          key: native-${{ runner.os }}-${{ hashFiles('core/native/**/CMakeLists.txt', 'core/native/src/main/cpp/**/*.{c,cpp,h,hpp}', 'core/native/src/main/cpp/adrenotools/**/*.{c,cpp,h,hpp}', 'build-logic/convention/src/main/kotlin/app/amphora/buildlogic/AndroidNativeConventionPlugin.kt') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/main' }}

      # Static checks first: they are the cheapest failures and the ones a human
      # would otherwise have to spot in review.
      - name: Kotlin formatting (spotless + ktlint)
        run: ./gradlew spotlessCheck --stacktrace
        timeout-minutes: 15

      - name: Android Lint
        run: ./gradlew lint --stacktrace
        timeout-minutes: 30

      - name: JVM unit tests
        run: bash scripts/ci-jvm-test.sh
        timeout-minutes: 30

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
        timeout-minutes: 60

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore

      - name: ccache stats
        if: always()
        run: ccache -s || true
