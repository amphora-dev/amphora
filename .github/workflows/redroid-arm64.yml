name: ReDroid ARM64

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Optional CI run ID to test. Leave empty to use the latest successful main CI run.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: redroid-arm64
  cancel-in-progress: false

jobs:
  android-15:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, arm64, redroid, android15]
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: 127.0.0.1:5555
      REDROID_CONTAINER: redroid15
    steps:
      - name: Resolve source CI run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.ci_run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api() {
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/$1"
          }

          if [ -n "${WORKFLOW_RUN_ID:-}" ]; then
            run_id="$WORKFLOW_RUN_ID"
            head_sha="${WORKFLOW_HEAD_SHA:-}"
          elif [ -n "${MANUAL_RUN_ID:-}" ]; then
            run_id="$MANUAL_RUN_ID"
            head_sha=""
          else
            # Manual "Run workflow" with empty input → latest green main CI.
            run_id="$(api 'actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')"
            echo "Using latest successful main CI run: ${run_id}"
          fi

          test -n "$run_id"

          if [ -z "${head_sha:-}" ]; then
            head_sha="$(api "actions/runs/${run_id}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          fi
          test -n "$head_sha"

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved CI run ${run_id} @ ${head_sha}"

      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          persist-credentials: false

      - name: Download CI APKs
        uses: actions/download-artifact@v8
        with:
          pattern: app-debug*.apk
          path: ${{ runner.temp }}/amphora-apks
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Test Android 15 ARM64 and capture Wine
        shell: bash
        run: |
          APK_DIR="$RUNNER_TEMP/amphora-apks"
          EVIDENCE_DIR="$RUNNER_TEMP/redroid-evidence"
          bash scripts/redroid-ci.sh \
            "$APK_DIR/app-debug.apk" \
            "$APK_DIR/app-debug-androidTest.apk" \
            "$EVIDENCE_DIR"

      - name: Upload ReDroid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/redroid-evidence
          if-no-files-found: warn
          retention-days: 14
